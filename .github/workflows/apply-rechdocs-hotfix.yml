name: Apply RechDocs hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rechdocs-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested RechDocs corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('output/RechDocs_v3.4.1.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Final output: remove antithrombotic sections, preserving internal reconciliation data.
          blocks = [
              "\nANTITROMBÓTICOS EM USO:\n${fAntitromboticosEmUso(d.antitromboticos)}\n",
              "\nANTITROMBÓTICOS PRÉVIOS/SUSPENSOS:\n${fATBUtilizados(d.antitromboticos)}\n",
          ]
          for block in blocks:
              s = s.replace(block, "")

          # 2) Add output sanitizer for nutrition and CBC red-cell series.
          anchor = 'function renderAdmissao(d){'
          if 'function sanitizeRenderedClinicalText(text)' not in s:
              helper = r'''
function sanitizeRenderedClinicalText(text){
  let out=String(text||'');

  // Nutrição: normaliza enum interno e evita duplicação do rótulo humano.
  out=out.replace(/^NUTRIÇÃO:\s*([^\n]+)$/gmi,(m,v)=>{
    let x=String(v||'').replace(/\\_/g,'_').replace(/_/g,' ').replace(/\s+/g,' ').trim();
    const parts=x.split(/\s+[—–-]\s+/).map(z=>z.trim()).filter(Boolean);
    if(parts.length>=2 && keyName(parts[0])===keyName(parts[1])) x=parts[0];
    if(/^VIA ORAL\s+[—–-]\s+VIA ORAL$/i.test(x)) x='VIA ORAL';
    return 'NUTRIÇÃO: '+(x||'---');
  });

  // Hemograma: da série vermelha, o documento final mantém apenas Hb e Ht.
  out=out.split('\n').map(line=>{
    if(!/HEMOGRAMA:/i.test(line)) return line;
    let x=line;
    const drops=[
      /HEMÁCIAS?\s*[:=]?\s*[^;|]+[;|]?\s*/ig,
      /VCM\s*[:=]?\s*[^;|]+[;|]?\s*/ig,
      /HCM\s*[:=]?\s*[^;|]+[;|]?\s*/ig,
      /CHCM\s*[:=]?\s*[^;|]+[;|]?\s*/ig,
      /RDW\s*[:=]?\s*[^;|]+[;|]?\s*/ig,
    ];
    drops.forEach(re=>{x=x.replace(re,'');});
    return x.replace(/;\s*;/g,'; ').replace(/\|\s*\|/g,'|').replace(/\s{2,}/g,' ').trim();
  }).join('\n');

  return out;
}

function applyClinicalHeadingBold(root){
  if(!root)return;
  const standalone=[
    'EVOLUÇÃO PERÍODO DIURNO','EVOLUÇÃO PERÍODO NOTURNO','UTI GERAL I','UTI GERAL II','UTI GERAL III',
    'EXAME CLINICO','EXAME CLÍNICO','ADMISSÃO','DOCUMENTO COMPLEMENTAR'
  ];
  const labels=[
    'NOME','ALERGIAS','SAPS III','PESO','HIPÓTESES DIAGNOSTICAS','HIPÓTESES DIAGNÓSTICAS',
    'HISTÓRIA DA DOENÇA ATUAL','HPMA','HD','ADMISSÃO UTI','ANTECEDENTES PATOLÓGICOS E CIRÚRGICOS',
    'MEDICAÇÕES DE USO CONTINUO','MEDICAÇÕES DE USO CONTÍNUO','PROFILAXIAS','GÁSTRICA','TEP/ TVP','TEP/TVP','OUTROS',
    'ANTIMICROBIANOS EM USO','ANTIMICROBIANOS QUE FORAM UTILIZADOS','SEDAÇÃO/ ANALGESIA','SEDAÇÃO / ANALGESIA',
    'BLOQUEADOR NEUROMUSCULAR','OUTRAS INFUSÕES CONTÍNUAS','DROGAS VASOATIVAS','DISPOSITIVOS INVASIVOS',
    'EXAMES DE MAIOR IMPORTÂNCIA','INTERCONSULTAS','AC','FC','PA','AP','NEUROLÓGICO','VENTILATÓRIO','ABDOME',
    'MEMBROS SUPERIORES/ INFERIORES','MEMBROS SUPERIORES / INFERIORES','ULCERAS DE PRESSÃO','ÚLCERAS DE PRESSÃO',
    'OUTRAS INFORMAÇÕES RELEVANTES','CONTROLES E BALANCOS DAS ULTIMAS 24 HORAS','CONTROLES E BALANÇOS DAS ÚLTIMAS 24 HORAS',
    'NUTRIÇÃO','INTERCORRÊNCIAS','DEMANDA FAMILIAR','JUSTIFICATIVA DE PERMANÊNCIA EM UTI','CONDUTAS',
    'EVOLUÇÃO MÉDICA','COMORBIDADES','MEDICAMENTOS EM USO','EXAME FÍSICO ATUAL','PARÂMETROS HEMODINÂMICOS ATUAIS',
    'EXAMES RELEVANTES','IMPRESSÃO CLÍNICA'
  ];
  const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const labelRe=new RegExp('^\\s*('+labels.sort((a,b)=>b.length-a.length).map(esc).join('|')+')(:)','i');
  const standaloneRe=new RegExp('^\\s*('+standalone.sort((a,b)=>b.length-a.length).map(esc).join('|')+')\\s*$','i');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const txt=node.nodeValue||'';
    if(!txt)return;
    const parts=txt.split(/(\n)/);
    if(!parts.some(part=>labelRe.test(part)||standaloneRe.test(part)))return;
    const frag=document.createDocumentFragment();
    parts.forEach(part=>{
      if(part==='\n'){frag.appendChild(document.createTextNode(part));return;}
      let m=part.match(labelRe);
      if(m){
        const idx=part.indexOf(m[1]);
        if(idx>0)frag.appendChild(document.createTextNode(part.slice(0,idx)));
        const strong=document.createElement('strong'); strong.textContent=m[1]+m[2]; frag.appendChild(strong);
        frag.appendChild(document.createTextNode(part.slice(idx+m[1].length+m[2].length)));
        return;
      }
      m=part.match(standaloneRe);
      if(m){
        const strong=document.createElement('strong'); strong.textContent=part; frag.appendChild(strong); return;
      }
      frag.appendChild(document.createTextNode(part));
    });
    node.replaceWith(frag);
  });
}
'''
              if anchor not in s:
                  raise SystemExit('renderAdmissao anchor not found')
              s = s.replace(anchor, helper + '\n' + anchor, 1)

          # 3) Sanitize BEFORE trace validation/rendering, so displayed and validated text match.
          old = 'const rendered=renderers[MODE](renderData);'
          new = 'const rendered=sanitizeRenderedClinicalText(renderers[MODE](renderData));'
          if old in s:
              s = s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('rendered assignment not found')

          # 4) Apply real HTML bolding after trace spans are built.
          old = 'renderTraceableOutput(displayedRendered,traceResult.items);\n    renderTraceReview(traceResult.items);'
          new = "renderTraceableOutput(displayedRendered,traceResult.items);\n    applyClinicalHeadingBold(document.getElementById('output-body'));\n    renderTraceReview(traceResult.items);"
          if old in s:
              s = s.replace(old,new,1)
          elif 'applyClinicalHeadingBold(document.getElementById(\'output-body\'))' not in s:
              raise SystemExit('trace render anchor not found')

          # 5) Manual correction in pre-evolution is an explicit human review action: release copy block.
          marker = "window.addEventListener('DOMContentLoaded',()=>{"
          if 'Edição manual registrada — cópia liberada' not in s:
              listener = r'''
document.addEventListener('input',(ev)=>{
  const el=ev.target;
  if(el && el.id==='prefill-editor'){
    setCopyBlocked(false);
    const state=document.getElementById('prefill-state');
    if(state)state.textContent='Edição manual registrada — cópia liberada. Pendências continuam visíveis para conferência.';
  }
});
'''
              pos=s.find(marker)
              if pos<0: raise SystemExit('DOMContentLoaded anchor not found')
              s=s[:pos]+listener+'\n'+s[pos:]

          s=s.replace(
            'Pré-evolução gerada com pendências clínicas — edição não remove o bloqueio; corrija a fonte e gere novamente.',
            'Pré-evolução gerada com pendências clínicas — revise e corrija manualmente; após sua edição, a cópia será liberada.'
          )

          # Assertions for requested invariants.
          if 'ANTITROMBÓTICOS EM USO:\n${fAntitromboticosEmUso(d.antitromboticos)}' in s:
              raise SystemExit('antithrombotic active output block still present')
          if 'ANTITROMBÓTICOS PRÉVIOS/SUSPENSOS:\n${fATBUtilizados(d.antitromboticos)}' in s:
              raise SystemExit('antithrombotic prior output block still present')
          for required in ['sanitizeRenderedClinicalText','applyClinicalHeadingBold','Edição manual registrada — cópia liberada']:
              if required not in s: raise SystemExit('missing patch: '+required)
          if s==original: raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          FILE=output/RechDocs_v3.4.1.html
          grep -q "function sanitizeRenderedClinicalText" "$FILE"
          grep -q "function applyClinicalHeadingBold" "$FILE"
          grep -q "Edição manual registrada — cópia liberada" "$FILE"
          ! grep -Fq 'ANTITROMBÓTICOS EM USO:\n${fAntitromboticosEmUso(d.antitromboticos)}' "$FILE"
          ! grep -Fq 'ANTITROMBÓTICOS PRÉVIOS/SUSPENSOS:\n${fATBUtilizados(d.antitromboticos)}' "$FILE"

      - name: Commit patched output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/RechDocs_v3.4.1.html
          git commit -m "fix: apply requested RechDocs clinical output corrections"
          git push
