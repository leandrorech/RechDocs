name: Apply RechDocs P0 clinical rules

on:
  push:
    branches:
      - fix/rechdocs-p0-clinical-rules-20260816
    paths:
      - .github/workflows/apply-rechdocs-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rechdocs-p0-clinical-rules-20260816

      - name: Apply clinical rules
        run: python scripts/apply_p0_clinical_rules.py

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Static audit
        run: python tests/static_audit.py output/RechDocs_v3.4.1.html

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('output/RechDocs_v3.4.1.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I)
          Path('/tmp/rechdocs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/rechdocs.js

      - name: Focused P0 browser regressions
        run: node tests/p0-clinical-rules.mjs

      - name: Existing characterization suite
        run: node tests/characterization/harness/run-characterization.mjs

      - name: Commit corrected candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/RechDocs_v3.4.1.html reports/P0_CLINICAL_RULES_2026-08-16.md
          git commit -m 'fix: enforce temporal exams infusion and interconsult rules'
          git push origin HEAD:fix/rechdocs-p0-clinical-rules-20260816
