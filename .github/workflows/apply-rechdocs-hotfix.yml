name: Build and validate RechDocs v3.4.2

on:
  push:
    branches: [feat/rechdocs-v3.4.2]
    paths:
      - '.github/workflows/apply-rechdocs-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v342:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.4.2
        run: python scripts/build_v342.py

      - name: Align synthetic E2E source with dose-literal contract
        run: python scripts/patch_v342_tests.py

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/static_audit.py output/RechDocs_v3.4.2.html
          grep -q 'gpt-5.6-terra' output/RechDocs_v3.4.2.html
          grep -q 'gemini-3.6-flash' output/RechDocs_v3.4.2.html
          grep -q 'deepseek-v4-pro' output/RechDocs_v3.4.2.html
          grep -q 'qwen3.7-plus' output/RechDocs_v3.4.2.html
          grep -q 'function validateDoseLiteralness' output/RechDocs_v3.4.2.html
          ! grep -Fq 'if(ap.mv)p.push(`MV ${ap.mv}`)' output/RechDocs_v3.4.2.html

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          CHROME=$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"

      - name: Full characterization
        shell: bash
        run: |
          set -euo pipefail
          node tests/characterization/harness/run-characterization.mjs
          python scripts/check_characterization_candidate.py

      - name: v3.4.2 focused guard
        run: node tests/v342_guard.mjs

      - name: Write test evidence
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum output/RechDocs_v3.4.2.html | awk '{print $1}')
          BYTES=$(wc -c < output/RechDocs_v3.4.2.html | tr -d ' ')
          {
            echo '# RechDocs v3.4.2 — test results'
            echo
            echo 'Data: 2026-08-16'
            echo
            echo "- artifact: output/RechDocs_v3.4.2.html"
            echo "- sha256: $SHA"
            echo "- bytes: $BYTES"
            echo '- static audit: PASS'
            echo '- candidate characterization gate: PASS (all fixtures candidate.pass=true)'
            echo '- v3.4.2 focused guard: PASS'
            echo '- guard covers: white background, compact preview, MV de-duplication, model catalogs, Qwen vision, obsolete saved-model fallback, dose no-correction policy.'
          } > reports/V3_4_2_TEST_RESULTS.md

      - name: Commit candidate and restore main workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/apply-rechdocs-hotfix.yml
          git add output/RechDocs_v3.4.2.html AGENTS.md scripts/build_v342.py scripts/patch_v342_tests.py scripts/check_characterization_candidate.py tests/characterization/harness/run-characterization.mjs tests/characterization/harness/browser-adapter.mjs tests/characterization/harness/capture-state.mjs tests/characterization/reports/characterization_run_result.json tests/v342_guard.mjs reports/V3_4_2_CHANGELOG.md reports/V3_4_2_TEST_RESULTS.md .github/workflows/apply-rechdocs-hotfix.yml
          git commit -m 'feat: RechDocs v3.4.2 — UI compacta, modelos atuais e trava de dose'
          git push origin HEAD:feat/rechdocs-v3.4.2
