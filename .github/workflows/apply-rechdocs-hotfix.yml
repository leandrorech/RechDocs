name: Apply RechDocs P0 clinical rules

on:
  push:
    branches:
      - fix/rechdocs-p0-clinical-rules-20260816
    paths:
      - .github/workflows/apply-rechdocs-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rechdocs-p0-clinical-rules-20260816

      - name: Prepare patch self-check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_p0_clinical_rules.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    'status=\"solicitada\"|\"aguardando\"|\"realizada\"',\n", "    'Solicitação NÃO é parecer realizado',\n")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply P0 clinical rules
        run: |
          python scripts/apply_p0_clinical_rules.py
          python scripts/apply_unit_conflict_safeguard.py

      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          test -n "$CHROME"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium

      - name: Static audit
        run: python tests/static_audit.py output/RechDocs_v3.4.1.html

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('output/RechDocs_v3.4.1.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I)
          Path('/tmp/rechdocs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/rechdocs.js

      - name: Focused P0 browser regressions
        run: node tests/p0-clinical-rules.mjs

      - name: Existing characterization suite
        run: node tests/characterization/harness/run-characterization.mjs

      - name: Assert current candidate characterization
        run: python scripts/assert_candidate_characterization.py

      - name: Create tested detached commit
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_detached_tested_commit.py
