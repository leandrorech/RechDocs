name: Build RechDocs API Hotfix

on:
  push:
    branches:
      - dev/rechdocs-continuation-2026-08-09
    paths:
      - scripts/build_api_hotfix.py
      - .github/workflows/build-api-hotfix.yml
      - output/RechDocs_v3.4.1.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/rechdocs-continuation-2026-08-09

      - name: Generate API hotfix
        run: python3 scripts/build_api_hotfix.py

      - name: Syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('output/RechDocs_v3.4.1_API_HOTFIX.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = [s for s in scripts if s.strip()]
          Path('/tmp/rechdocs-inline.js').write_text('\n'.join(inline), encoding='utf-8')
          print(f'{len(inline)} bloco(s) inline extraído(s)')
          PY
          node --check /tmp/rechdocs-inline.js

      - name: Run repository CJS tests
        shell: bash
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "==> $f"
            node "$f"
          done < <(find tests -maxdepth 1 -type f -name '*.cjs' -print0 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo 'Nenhum teste .cjs encontrado; validação limitada ao builder + node --check.'
          fi

      - name: Confirm requested hotfix properties
        run: |
          grep -q "gpt-5.6-terra" output/RechDocs_v3.4.1_API_HOTFIX.html
          ! grep -q "ANTITROMBÓTICOS EM USO:" output/RechDocs_v3.4.1_API_HOTFIX.html
          ! grep -q "ANTITROMBÓTICOS PRÉVIOS/SUSPENSOS:" output/RechDocs_v3.4.1_API_HOTFIX.html
          grep -q "https://api.openai.com/v1/chat/completions" output/RechDocs_v3.4.1_API_HOTFIX.html

      - name: Commit generated hotfix
        run: |
          if [ -z "$(git status --porcelain -- output/RechDocs_v3.4.1_API_HOTFIX.html)" ]; then
            echo 'Hotfix já está atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/RechDocs_v3.4.1_API_HOTFIX.html
          git commit -m 'build: generate RechDocs v3.4.1 API hotfix'
          git push origin HEAD:dev/rechdocs-continuation-2026-08-09
