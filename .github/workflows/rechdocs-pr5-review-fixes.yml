name: RechDocs PR5 review fixes

on:
  push:
    branches:
      - fix/rechdocs-p0-review-fixes-work
    paths:
      - '.github/workflows/rechdocs-pr5-review-fixes.yml'
      - 'scripts/apply_pr5_review_fixes.py'
      - 'tests/p0-clinical-rules.mjs'
      - 'reports/P0_CLINICAL_RULES_2026-08-16.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-fix-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: fix/rechdocs-p0-review-fixes-work

      - name: Apply review fixes
        run: python scripts/apply_pr5_review_fixes.py

      - name: Install browser runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          test -n "$CHROME"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium

      - name: Static audit
        run: python tests/static_audit.py output/RechDocs_v3.4.1.html

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('output/RechDocs_v3.4.1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/rechdocs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/rechdocs.js

      - name: Focused P0 review regressions
        run: node tests/p0-clinical-rules.mjs

      - name: Existing characterization suite
        run: node tests/characterization/harness/run-characterization.mjs

      - name: Assert candidate characterization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('tests/characterization/reports/characterization_run_result.json').read_text(encoding='utf-8'))
          bad=[]
          for item in data.get('fixtures', data.get('results', [])):
              if not isinstance(item,dict):
                  continue
              cand=item.get('candidate',{})
              if cand.get('pass') is False:
                  bad.append(item.get('id') or item.get('fixture') or 'unknown')
          if bad:
              raise SystemExit('candidate characterization failures: '+', '.join(bad))
          print('candidate characterization assertions: PASS')
          PY

      - name: Create clean detached commit for PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: bf4b6c565afc5c719db1bc93ede87fbc7b89717e
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          parent=os.environ['PARENT_SHA']
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
          }

          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode('utf-8'))

          base_tree=request('GET',f'{api}/git/commits/{parent}')['tree']['sha']

          entries=[]
          for path in [
              'output/RechDocs_v3.4.1.html',
              'tests/p0-clinical-rules.mjs',
              'reports/P0_CLINICAL_RULES_2026-08-16.md',
          ]:
              raw=Path(path).read_bytes()
              blob=request('POST',f'{api}/git/blobs',{
                  'content':base64.b64encode(raw).decode('ascii'),
                  'encoding':'base64',
              })['sha']
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob})

          tree=request('POST',f'{api}/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=request('POST',f'{api}/git/commits',{
              'message':'fix: address independent PR5 review findings',
              'tree':tree,
              'parents':[parent],
          })['sha']
          print(f'DETACHED_COMMIT_SHA={commit}')
          print(f'DETACHED_TREE_SHA={tree}')
          PY
