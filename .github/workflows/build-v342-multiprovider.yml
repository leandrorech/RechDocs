name: RechDocs v3.4.2 multi-provider
on:
  push:
    branches: [feat/rechdocs-v3.4.2]
    paths:
      - 'scripts/add_rech_ai_multiprovider.py'
      - '.github/workflows/build-v342-multiprovider.yml'
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v3.4.2 from current P0-corrected v3.4.1
        run: |
          python scripts/build_v342.py
          python scripts/add_rech_ai_multiprovider.py
          python scripts/patch_v342_tests.py
      - name: Static contract and P0 preservation
        run: |
          python tests/static_audit.py output/RechDocs_v3.4.2.html
          grep -q 'RECH-AI-01' output/RechDocs_v3.4.2.html
          grep -q "data-provider=\"kimi\"" output/RechDocs_v3.4.2.html
          grep -q "data-provider=\"custom\"" output/RechDocs_v3.4.2.html
          grep -q 'kimi-k2.6' output/RechDocs_v3.4.2.html
          grep -q 'api.moonshot.ai/v1/chat/completions' output/RechDocs_v3.4.2.html
          grep -q 'customChatEndpoint' output/RechDocs_v3.4.2.html
          grep -q 'SEM DATA REGISTRADA' output/RechDocs_v3.4.2.html
          grep -q 'function isContinuousInfusion' output/RechDocs_v3.4.2.html
          grep -q 'e.__showUnit=true' output/RechDocs_v3.4.2.html
          grep -q "keyName(e.unidade||'')" output/RechDocs_v3.4.2.html
          grep -q 'cleanStr(e.hora)' output/RechDocs_v3.4.2.html
      - name: Browser characterization and existing release guard
        run: |
          npm ci
          npx playwright install --with-deps chromium
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")
          node tests/characterization/harness/run-characterization.mjs
          python scripts/check_characterization_candidate.py
          node tests/v342_guard.mjs
      - name: Materialize tested candidate commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']
          token=os.environ['GH_TOKEN']
          root='https://api.github.com/repos/'+repo

          def api(path, method='GET', payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(root+path,data=data,method=method,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json'
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          changed=[x.strip() for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x.strip()]
          if not changed:
              print('NO_GENERATED_CHANGES')
              raise SystemExit(0)
          base_tree=api('/git/commits/'+parent)['tree']['sha']
          entries=[]
          for path in changed:
              if not os.path.isfile(path):
                  continue
              raw=open(path,'rb').read()
              blob=api('/git/blobs','POST',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
              print('MATERIALIZED',path,blob['sha'])
          tree=api('/git/trees','POST',{'base_tree':base_tree,'tree':entries})
          commit=api('/git/commits','POST',{
              'message':'feat: RechDocs v3.4.2 multi-provider tested candidate',
              'tree':tree['sha'],
              'parents':[parent]
          })
          print('CANDIDATE_COMMIT_SHA='+commit['sha'])
          PY
